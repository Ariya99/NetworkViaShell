name: Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libfuse2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile
      - name: Build Linux packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --bundles deb,appimage
          tagName: ${{ github.ref_name }}
          releaseName: NetworkViaShell ${{ github.ref_name }}
          releaseBody: "NetworkViaShell SSH SOCKS5 desktop release. See the repository README for installation and verification notes."
          releaseDraft: true
          prerelease: true

  build-windows:
    name: Build and publish Windows x64 installer
    needs: build-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile
      - name: Build Windows installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkViaShell-windows-x64-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach Windows installer to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" target/release/bundle/nsis/*.exe --clobber
